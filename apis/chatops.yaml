openapi: 3.1.0
info:
  title: ChatOps
  description: ChatOps 세션 및 프로젝트 API
  version: 1.0.0
tags:
  - name: Projects
  - name: Sessions
paths:
  /chatops/projects:
    post:
      summary: 프로젝트 생성
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: demo
              description: 데모 프로젝트
      responses:
        '201':
          description: 생성된 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              example:
                project_id: 1001
                user_id: user-1
                name: demo
                description: 데모 프로젝트
                status: active
                created_at: '2026-04-20T10:00:00Z'
                updated_at: '2026-04-20T10:00:00Z'
    get:
      summary: 내 프로젝트 목록 조회
      tags:
        - Projects
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'

  /chatops/projects/{project_id}:
    get:
      summary: 프로젝트 단건 조회
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: 프로젝트 없음
    delete:
      summary: 프로젝트 삭제
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '404':
          description: 프로젝트 없음

  /chatops/sessions:
    post:
      summary: 세션 생성
      description: project_id를 생략하면 프로젝트 없는 독립 세션으로 생성된다.
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            examples:
              독립 세션:
                value:
                  title: 일반 상담
              프로젝트 하위 세션:
                value:
                  title: 프로젝트 생성 상담
                  project_id: 1001
      responses:
        '201':
          description: 생성된 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
    get:
      summary: 세션 목록 조회
      description: project_id를 전달하면 해당 프로젝트의 세션만 반환한다.
      tags:
        - Sessions
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 프로젝트 필터 (생략 시 전체 세션)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 세션 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'

  /chatops/sessions/{session_id}:
    get:
      summary: 세션 상세 조회
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 세션 상세 + 메시지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '404':
          description: 세션 없음
    delete:
      summary: 세션 삭제
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '404':
          description: 세션 없음
        '409':
          description: 처리 중인 요청이 있어 삭제 불가

  /chatops/sessions/{session_id}/messages:
    post:
      summary: 세션에 메시지 전송
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required:
                - message
      responses:
        '202':
          description: 메시지 수신 및 처리 시작
    get:
      summary: 세션 메시지 페이지 조회
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 메시지 페이지

webhooks: {}
components:
  schemas:
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
        - name

    ProjectResponse:
      type: object
      properties:
        project_id:
          type: integer
          format: int64
        user_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - project_id
        - user_id
        - name
        - status

    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
      required:
        - projects

    CreateSessionRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
        project_id:
          type: integer
          format: int64
          nullable: true
          description: 연결할 프로젝트 ID (생략 가능)

    SessionResponse:
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        user_id:
          type: string
        project_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - session_id
        - user_id
        - status

    SessionListItem:
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        last_message_preview:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
      required:
        - session_id
        - status

    SessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionListItem'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required:
        - sessions
        - has_more

    SessionDetailResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionResponse'
        messages:
          type: array
          items:
            type: object
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required:
        - session
        - messages
        - has_more

  responses: {}
  securitySchemes: {}
servers: []
security: []
