components:
  schemas:
    ApplicationItem:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        runtime:
          anyOf:
            - type: string
            - type: 'null'
          title: Runtime
        pod_count:
          type: integer
          minimum: 0
          title: Pod Count
          default: 0
        exposed_port:
          anyOf:
            - type: integer
            - type: 'null'
          title: Exposed Port
        cpu_usage_percent:
          anyOf:
            - type: number
            - type: 'null'
          title: Cpu Usage Percent
        ram_usage_percent:
          anyOf:
            - type: number
            - type: 'null'
          title: Ram Usage Percent
        health_status:
          type: string
          enum:
            - Healthy
            - Unhealthy
            - Stopped
          title: Health Status
          default: Stopped
      type: object
      required:
        - id
        - name
      title: ApplicationItem
      x-apidog-orders:
        - id
        - name
        - runtime
        - pod_count
        - exposed_port
        - cpu_usage_percent
        - ram_usage_percent
        - health_status
