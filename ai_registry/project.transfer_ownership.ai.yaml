id: project.transfer_ownership
source_file: apis/project.yaml
operation_id: transfer_project_ownership_endpoint_projects__project_id__owner_patch
path: /projects/{project_id}/owner
method: PATCH
summary: 프로젝트 소유권을 다른 사용자에게 이전한다
capability: 프로젝트 소유자(OWNER) 이전
usable_in:
- command
operation_kind: write
when_to_use:
- 프로젝트 OWNER 권한을 다른 멤버에게 넘기려 할 때
- "소유권 이전", "주인 바꿔", "OWNER 변경", "오너 넘겨줘" 등의 표현이 쓰일 때
when_not_to_use:
- 일반 멤버 추가/삭제는 project.add_member / project.remove_member를 사용
- 단순히 소유자가 누구인지 확인만 할 때는 project.check_owner를 사용
- 프로젝트 이름만 바꿀 때는 project.update_name을 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 기존 소유자는 일반 멤버 권한으로 내려가고, 대상 사용자가 새 소유자가 됨
- 프로젝트 삭제/설정 권한이 새 소유자에게 넘어감
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/ProjectOwnerTransfer'
    type: object
    required_fields:
    - target_user_id
preconditions:
- 현재 사용자가 해당 프로젝트의 소유자여야 합니다.
- 대상 프로젝트와 새 소유자가 될 사용자 식별자가 필요합니다.
missing_info_questions:
- 어느 프로젝트의 소유권을 이전할까요?
- 새 소유자로 지정할 사용자는 누구인가요?
response_interpretation: 이전 소유자와 새 소유자를 함께 보여주며 이전 완료를 알립니다.
plan_template:
- 현재 소유 여부와 새 소유자 후보를 확인합니다.
- 권한이 넘어간다는 점을 분명히 고지하고 승인을 받습니다.
- 이전 결과를 요약합니다.
examples:
- "bang 프로젝트 소유권을 jaemin한테 넘겨줘"
- "test 프로젝트 OWNER를 홍길동으로 변경"
- "myproject 오너 user123으로 이전해줘"
