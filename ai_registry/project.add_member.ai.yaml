id: project.add_member
source_file: apis/project.yaml
operation_id: add_project_member_endpoint_projects__project_id__members_post
path: /projects/{project_id}/members
method: POST
summary: 프로젝트에 멤버(사용자)를 추가한다
capability: 프로젝트 멤버 추가 (특정 사용자를 구성원으로 등록)
usable_in:
- command
operation_kind: write
when_to_use:
- 프로젝트에 새 멤버를 참여시킬 때
- '멤버 추가, 누구 초대해줘, 팀에 넣어줘 등의 표현이 쓰일 때'
when_not_to_use:
- 멤버를 빼려면 project.remove_member를 사용
- 멤버 목록을 보려면 project.list_members를 사용
- 소유권을 이전하려면 project.transfer_ownership을 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 대상 사용자가 프로젝트에 접근할 수 있게 됨
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/ProjectMemberAdd'
    type: object
    required_fields:
    - user_id
preconditions:
- 대상 프로젝트와 추가할 사용자 식별자가 필요합니다.
missing_info_questions:
- 어느 프로젝트에 멤버를 추가할까요?
- 추가할 사용자는 누구인가요? (사용자 ID 또는 사용자명)
response_interpretation: 추가된 멤버의 사용자명과 프로젝트 이름을 사용자에게 요약합니다.
plan_template:
- 대상 프로젝트와 추가 대상 사용자를 확인합니다.
- 추가 전 사용자에게 영향을 설명하고 승인을 받습니다.
- 추가 결과를 요약합니다.
examples:
- "bang 프로젝트에 jaemin 추가해줘"
- "test 프로젝트에 홍길동 초대"
- "myproject 팀에 user123 넣어줘"
