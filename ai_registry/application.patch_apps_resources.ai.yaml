id: application.patch_apps_resources
source_file: apis/application.yaml
operation_id: null
path: /apps/resources
method: PATCH
summary: 특정 애플리케이션의 자원(CPU/메모리/디스크) 한도를 변경한다
capability: 애플리케이션 자원 사양 변경 (max_cpu, max_memory, max_disk)
usable_in:
- command
operation_kind: write
when_to_use:
- 이미 배포된 애플리케이션의 CPU/메모리/디스크를 조정할 때
- '앱 CPU 늘려줘, 메모리 올려, 자원 줄여줘 등 애플리케이션 단위 자원 변경 표현이 쓰일 때'
when_not_to_use:
- 프로젝트 전체 자원 한도를 바꾸는 경우에는 project.update_resource를 사용
- GitHub 레포 연결만 바꾸려면 application.patch_apps_github을 사용
- 새 앱을 만드는 경우에는 application.create_apps를 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 애플리케이션 재기동이 발생할 수 있음
- 프로젝트 전체 자원 한도 내에서만 변경 가능
required_headers: []
required_inputs:
  headers: []
  path: []
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/UpdateResourceInfoRequestDto'
    type: object
    required_fields:
    - application_id
    - max_cpu
    - max_memory
    - max_disk
important_inputs:
  path: []
  query: []
  body:
  - project_id
  - application_id
  - max_cpu
  - max_memory
  - max_disk
preconditions:
- 대상 애플리케이션과 새 자원 값이 필요합니다.
- 프로젝트 자원 한도 내여야 합니다.
missing_info_questions:
- 어느 프로젝트의 앱인가요?
- 어느 애플리케이션의 자원을 변경할까요?
- 새 CPU 값은 얼마로 할까요?
- 새 메모리 값은 얼마로 할까요?
- 새 디스크 값은 얼마로 할까요?
response_interpretation: 변경 전/후 CPU, 메모리, 디스크 값을 비교해서 보여줍니다.
plan_template:
- 대상 애플리케이션과 새 자원 사양을 확인합니다.
- 재기동 등 영향 범위를 설명하고 사용자 승인을 받습니다.
- 변경 결과를 요약합니다.
examples:
- "bang 프로젝트 api 앱 CPU 4로 올려줘"
- "test 프로젝트 webapp 메모리 8GB로 변경"
- "myproject worker 자원 줄여줘: CPU 1, 메모리 2GB"
