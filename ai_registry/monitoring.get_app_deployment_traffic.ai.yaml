id: monitoring.get_app_deployment_traffic
source_file: apis/monitoring.yaml
operation_id: get_app_deployment_traffic_monitoring_app_deployment__project_id___app_deployment_name__get
path: /monitoring/app-deployment/{project_id}/{app_deployment_name}
method: GET
summary: 특정 애플리케이션의 트래픽 지표(요청량/응답 시간 등)를 조회한다
capability: 애플리케이션 트래픽/모니터링 지표 조회 (기간 지정 가능)
usable_in:
- query
operation_kind: read
when_to_use:
- 애플리케이션이 받은 요청량, 트래픽 추이를 확인할 때
- '트래픽 얼마나 왔어?, 요청 수, 모니터링 지표, traffic 등의 표현이 쓰일 때'
- 특정 기간(시작/종료)의 부하 분석이 필요할 때
when_not_to_use:
- 로그가 필요하면 application.get_apps_logs를 사용
- 현재 상태(Running 여부)만 보려면 application.get_apps_status를 사용
- 자원 사용량/설정은 application.get_apps_details를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
  - name: X-User-Role
    required: true
    type: string
  path:
  - name: project_id
    required: true
    type: integer
  - name: app_deployment_name
    required: true
    type: string
  query:
  - name: start
    required: false
    type: string
  - name: end
    required: false
    type: string
  body: null
preconditions:
- 조회할 프로젝트와 애플리케이션이 필요합니다.
- 기간을 지정하지 않으면 기본 범위로 조회합니다.
missing_info_questions:
- 어느 프로젝트의 앱인가요?
- 어느 애플리케이션의 트래픽을 조회할까요?
- 기간을 지정하고 싶으면 시작/종료 시각을 알려주세요. (생략 가능)
response_interpretation: 기간 내 요청 수, 트래픽 추이 등 핵심 지표를 요약해서 보여줍니다.
plan_template: []
examples:
- "bang 프로젝트 api 앱 트래픽 보여줘"
- "test 프로젝트 webapp 어제부터 오늘까지 요청량"
- "myproject worker 모니터링 지표"
