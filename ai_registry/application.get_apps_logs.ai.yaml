id: application.get_apps_logs
source_file: apis/application.yaml
operation_id: null
path: /apps/logs
method: GET
summary: 특정 애플리케이션의 실행 로그를 조회한다
capability: 애플리케이션 로그(stdout/stderr) 조회
usable_in:
- query
operation_kind: read
when_to_use:
- 애플리케이션의 최근 로그를 확인해야 할 때
- "로그 보여줘", "에러 확인", "무슨 로그 찍히고 있어", "logs" 등의 표현이 쓰일 때
- 에러 디버깅이나 장애 원인 파악이 필요할 때
when_not_to_use:
- 단순 상태(running 여부)만 보려면 application.get_apps_status를 사용
- 트래픽/요청 지표가 필요하면 monitoring.get_app_deployment_traffic을 사용
- 자원 사용량/설정은 application.get_apps_details를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers: []
required_inputs:
  headers: []
  path: []
  query:
  - name: project_id
    required: true
    type: string
  - name: app_name
    required: true
    type: string
  body: null
preconditions:
- 어느 프로젝트의 어떤 애플리케이션인지 특정이 필요합니다.
missing_info_questions:
- 어느 프로젝트의 앱인가요?
- 어느 애플리케이션의 로그를 볼까요?
response_interpretation: 로그 내용을 가독성 좋게 정리하고, 에러가 있으면 강조해서 보여줍니다.
plan_template: []
examples:
- "bang 프로젝트 api 앱 로그 보여줘"
- "test 프로젝트 webapp 에러 확인"
- "myproject worker logs"
