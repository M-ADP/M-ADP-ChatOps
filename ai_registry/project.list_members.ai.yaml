id: project.list_members
source_file: apis/project.yaml
operation_id: list_project_members_endpoint_projects__project_id__members_get
path: /projects/{project_id}/members
method: GET
summary: 특정 프로젝트의 멤버 목록을 조회한다
capability: 프로젝트 멤버 목록 조회 (사용자명과 역할)
usable_in:
- query
operation_kind: read
when_to_use:
- 사용자가 프로젝트의 참여 멤버를 확인하고 싶을 때
- "멤버 목록", "누가 있어", "멤버 보여줘", "구성원" 등의 표현이 쓰일 때
when_not_to_use:
- 멤버를 추가하려면 project.add_member를 사용
- 멤버를 제거하려면 project.remove_member를 사용
- 프로젝트 목록 자체가 필요하면 project.list_projects를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body: null
preconditions:
- 조회할 프로젝트의 이름 또는 ID가 필요합니다.
missing_info_questions:
- 어떤 프로젝트의 멤버 목록을 조회할까요?
response_interpretation: 각 멤버의 사용자명과 역할(OWNER/MEMBER)을 쉼표로 구분하여 나열합니다.
plan_template: []
examples:
- "bang 프로젝트 멤버 보여줘"
- "test 프로젝트에 누가 있어?"
- "myproject 구성원 목록"
