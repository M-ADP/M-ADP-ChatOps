id: project.update_name
source_file: apis/project.yaml
operation_id: update_project_name_endpoint_projects__project_id__name_patch
path: /projects/{project_id}/name
method: PATCH
summary: 기존 프로젝트의 이름을 변경한다
capability: 기존 프로젝트의 이름 변경 (rename)
usable_in:
- command
operation_kind: write
when_to_use:
- 이미 존재하는 프로젝트의 이름을 바꿀 때
- "이름 변경", "이름 바꿔줘", "rename", "{old}를 {new}로 바꿔" 등의 표현이 쓰일 때
when_not_to_use:
- 새 프로젝트를 만드는 경우에는 project.create를 사용 (이 경우 '이름'은 단지 새로 만드는 이름이지 변경이 아님)
- 자원 한도 변경은 project.update_resource를 사용
- 애플리케이션 이름 변경이 아닌 '프로젝트' 이름 변경에만 해당
requires_confirmation: true
risk_level: medium
side_effects:
- 프로젝트 이름이 변경됨 (URL/레퍼런스에 영향 가능)
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/ProjectNameUpdate'
    type: object
    required_fields:
    - name
preconditions:
- 대상 프로젝트(기존)와 새 이름이 모두 필요합니다.
missing_info_questions:
- 어느 프로젝트의 이름을 바꿀까요? (기존 프로젝트 이름)
- 새로운 이름은 무엇으로 할까요?
response_interpretation: 변경 전/후 이름을 사용자에게 보여줍니다.
plan_template:
- 변경할 프로젝트와 새 이름을 확인합니다.
- 변경 전 사용자에게 영향을 설명하고 승인을 받습니다.
- 변경 후 결과를 요약합니다.
examples:
- "bang 프로젝트 이름을 bang2로 바꿔줘"
- "test 프로젝트를 myproject로 rename"
- "myproject 이름을 demo로 변경해줘"
