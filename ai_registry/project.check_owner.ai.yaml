id: project.check_owner
source_file: apis/project.yaml
operation_id: check_project_owner_endpoint_projects_owner_get
path: /projects/owner
method: GET
summary: 현재 사용자가 특정 프로젝트의 소유자(OWNER)인지 확인한다
capability: 프로젝트 소유자 여부 확인
usable_in:
- query
operation_kind: read
when_to_use:
- 사용자가 "내가 이 프로젝트 주인이야?", "소유자야?" 등을 묻는 경우
- 소유권 이전이나 삭제 전에 권한을 확인할 때
when_not_to_use:
- 단순히 접근 가능한지 확인할 때는 project.check_available을 사용
- 소유권을 이전할 때는 project.transfer_ownership을 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path: []
  query:
  - name: project_id
    required: true
    type: integer
    description: 확인할 프로젝트 ID
  body: null
preconditions:
- 확인할 프로젝트의 이름 또는 ID가 필요합니다.
missing_info_questions:
- 어떤 프로젝트의 소유자 여부를 확인할까요?
response_interpretation: 소유자이면 "소유자입니다", 아니면 "소유자가 아닙니다"로 응답합니다.
plan_template: []
examples:
- "내가 bang 프로젝트 소유자야?"
- "test 프로젝트 owner 맞아?"
