id: project.create
source_file: apis/project.yaml
operation_id: create_project_endpoint_projects_post
path: /projects
method: POST
summary: 새 프로젝트를 생성한다
capability: 새 프로젝트 생성 (이름 지정, 선택적으로 자원 한도 설정)
usable_in:
- command
operation_kind: write
when_to_use:
- 사용자가 새로운 프로젝트를 만들려고 할 때
- "프로젝트 생성", "프로젝트 만들어줘", "새 프로젝트" 등의 표현이 쓰일 때
- 이름만 주어져도 기본 자원 한도로 생성 가능
when_not_to_use:
- 기존 프로젝트의 이름을 변경하는 경우에는 project.update_name을 사용
- 기존 프로젝트의 자원 한도를 바꾸는 경우에는 project.update_resource를 사용
- 프로젝트가 아닌 애플리케이션(앱)을 생성하는 경우에는 application.create_apps를 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 새 프로젝트가 생성되어 사용자 계정에 추가됨
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path: []
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/ProjectCreate'
    type: object
    required_fields:
    - name
important_inputs:
  path: []
  query: []
  body:
  - name
  - max_cpu
  - max_memory
  - max_disk
preconditions:
- 생성할 프로젝트 이름이 있어야 합니다. 자원 한도는 선택 사항이며, 생략 시 기본값이 적용됩니다.
missing_info_questions:
- 생성할 프로젝트의 이름을 알려주세요. (예: myproject)
response_interpretation: 생성된 프로젝트의 이름, ID, 자원 한도를 사용자에게 요약합니다.
plan_template:
- 입력받은 프로젝트 이름과 자원 한도를 확인합니다.
- 프로젝트 생성 전 사용자에게 영향 범위를 설명하고 승인을 받습니다.
- 생성 결과(프로젝트 ID, 자원 한도)를 사용자에게 요약합니다.
examples:
- "haha라는 이름으로 프로젝트 만들어줘"
- "myproject 프로젝트 생성해줘"
- "새 프로젝트 하나 만들어줘, 이름은 test"
- "프로젝트 이름은 demo, CPU 4, 메모리 8, 디스크 100으로 생성"
