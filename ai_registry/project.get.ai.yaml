id: project.get
source_file: apis/project.yaml
operation_id: get_project_endpoint_projects__project_id__get
path: /projects/{project_id}
method: GET
summary: 특정 프로젝트의 상세 정보를 조회한다
capability: 프로젝트 상세 정보 조회 (이름, 역할, 배포 목록 등)
usable_in:
- query
operation_kind: read
when_to_use:
- 사용자가 특정 프로젝트의 자세한 정보를 요청할 때
- '프로젝트 상세, 프로젝트 자세히 보여줘, {이름} 프로젝트 정보 등의 표현이 쓰일 때'
when_not_to_use:
- 전체 프로젝트 목록이 필요하면 project.list_projects를 사용
- 프로젝트의 자원 한도만 필요하면 project.get_resource_limit을 사용
- 프로젝트의 멤버 목록이 필요하면 project.list_members를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body: null
preconditions:
- 조회할 프로젝트를 특정할 수 있는 이름 또는 ID가 필요합니다. 이름만 주어져도 resolver가 ID로 변환합니다.
missing_info_questions:
- 어떤 프로젝트의 상세 정보를 보시겠어요? 프로젝트 이름을 알려주세요.
response_interpretation: 프로젝트 이름, 사용자 역할, 연결된 애플리케이션(배포) 개수를 요약합니다.
plan_template: []
examples:
- "bang 프로젝트 자세히 보여줘"
- "test 프로젝트 상세 정보"
- "myproject 프로젝트 정보 알려줘"
