id: application.get_apps
source_file: apis/application.yaml
operation_id: null
path: /apps
method: GET
summary: 특정 프로젝트에 속한 애플리케이션 목록과 상태를 조회한다
capability: 프로젝트 내 애플리케이션 전체 목록 조회 (이름과 현재 상태)
usable_in:
- query
operation_kind: read
when_to_use:
- 특정 프로젝트 안에 어떤 애플리케이션들이 있는지 한 번에 확인하고 싶을 때
- '앱 목록, 애플리케이션 뭐 있어, 배포된 앱들, 앱 상태 보여줘 등의 표현이 쓰일 때'
when_not_to_use:
- 단일 애플리케이션의 상태만 필요하면 application.get_apps_status를 사용
- 애플리케이션의 세부 스펙(자원/리소스/설정)이 필요하면 application.get_apps_details를 사용
- 로그가 필요하면 application.get_apps_logs를 사용
- 프로젝트 자체의 목록은 project.list_projects를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers: []
required_inputs:
  headers: []
  path: []
  query:
  - name: project_id
    required: true
    type: string
  body: null
preconditions:
- 조회할 프로젝트 이름 또는 ID가 필요합니다.
missing_info_questions:
- 어느 프로젝트의 애플리케이션 목록을 조회할까요?
response_interpretation: 각 애플리케이션의 이름과 상태(Running/Stopped 등)를 간략히 나열합니다.
plan_template: []
examples:
- "bang 프로젝트 앱 목록 보여줘"
- "test 프로젝트에 어떤 애플리케이션 있어?"
- "myproject 배포된 앱 상태 알려줘"
