id: project.list_member_invitations
source_file: apis/project.yaml
operation_id: list_project_member_invitations_endpoint_projects__project_id__member_invitations_get
path: /projects/{project_id}/member-invitations
method: GET
summary: 프로젝트의 대기 중인 멤버 초대 목록을 조회한다
capability: 프로젝트 멤버 초대 목록 조회 (수락 대기 중인 초대)
usable_in:
- query
operation_kind: read
when_to_use:
- 프로젝트의 초대 현황이나 대기 중인 초대를 확인하고 싶을 때
- '초대 목록, 초대 현황, 수락 대기 중인 초대 등의 표현이 쓰일 때'
when_not_to_use:
- 현재 멤버 목록은 project.list_members를 사용
- 초대를 취소하려면 project.cancel_member_invitation를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body: null
preconditions:
- 조회할 프로젝트의 이름 또는 ID가 필요합니다.
missing_info_questions:
- 어떤 프로젝트의 초대 목록을 조회할까요?
response_interpretation: 수락 대기 중인 초대 목록(대상 사용자, 초대 일시, 만료 일시)을 나열합니다.
plan_template: []
examples:
- "myapp 프로젝트 초대 목록 보여줘"
- "bang 프로젝트 대기 중인 초대 있어?"
- "test 프로젝트 초대 현황 조회"
