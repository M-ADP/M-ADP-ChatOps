id: project.get_resource_limit
source_file: apis/project.yaml
operation_id: get_project_resource_limit_endpoint_projects_resource_limit_get
path: /projects/resource-limit
method: GET
summary: 특정 프로젝트의 자원 한도(CPU/메모리/디스크)를 조회한다
capability: 프로젝트 자원 한도 조회 (max_cpu, max_memory, max_disk)
usable_in:
- query
operation_kind: read
when_to_use:
- 사용자가 프로젝트의 자원 한도(쿼터)만 확인하려 할 때
- "리소스 한도", "자원 제한", "CPU/메모리 얼마까지", "쿼터" 등의 표현이 쓰일 때
when_not_to_use:
- 프로젝트 전체 상세 정보가 필요하면 project.get을 사용
- 자원 한도를 변경하려면 project.update_resource를 사용
- 애플리케이션의 자원 정보는 application.get_apps_details를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path: []
  query:
  - name: project_id
    required: true
    type: integer
    description: 확인할 프로젝트 ID
  body: null
preconditions:
- 조회할 프로젝트 이름 또는 ID가 필요합니다.
missing_info_questions:
- 어떤 프로젝트의 자원 한도를 조회할까요? 프로젝트 이름을 알려주세요.
response_interpretation: max_cpu, max_memory, max_disk 값을 단위와 함께 요약합니다.
plan_template: []
examples:
- "bang 프로젝트 리소스 한도 알려줘"
- "test 프로젝트 자원 제한 얼마야"
- "myproject 쿼터 보여줘"
