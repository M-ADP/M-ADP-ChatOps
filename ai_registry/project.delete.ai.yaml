id: project.delete
source_file: apis/project.yaml
operation_id: delete_project_endpoint_projects__project_id__delete
path: /projects/{project_id}
method: DELETE
summary: 프로젝트를 영구 삭제한다
capability: 프로젝트 삭제 (하위 애플리케이션 및 자원 포함)
usable_in:
- command
operation_kind: delete
when_to_use:
- 사용자가 프로젝트 자체를 제거하려고 할 때
- "프로젝트 삭제", "프로젝트 지워줘", "delete project" 등의 표현이 쓰일 때
when_not_to_use:
- 프로젝트 안의 특정 애플리케이션만 삭제하려면 application.delete_apps를 사용
- 멤버만 제거하려면 project.remove_member를 사용
- 소유권만 이전하려면 project.transfer_ownership을 사용
requires_confirmation: true
risk_level: high
side_effects:
- 프로젝트와 그 안의 모든 애플리케이션, 설정이 영구적으로 삭제됨
- 복구 불가
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body: null
preconditions:
- 삭제할 프로젝트가 특정되어야 합니다.
- 프로젝트 소유자여야 합니다.
missing_info_questions:
- 어떤 프로젝트를 삭제할까요? (이름 또는 ID)
response_interpretation: 삭제된 프로젝트 이름을 명시하고, 삭제됐다는 사실을 사용자에게 알립니다.
plan_template:
- 삭제 대상 프로젝트와 소유 여부를 확인합니다.
- 삭제가 불가역적임을 사용자에게 분명히 경고하고 승인을 받습니다.
- 삭제 후 결과를 요약합니다.
examples:
- "bang 프로젝트 삭제해줘"
- "test 프로젝트 지워"
- "myproject 프로젝트 delete"
