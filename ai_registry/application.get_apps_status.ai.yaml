id: application.get_apps_status
source_file: apis/application.yaml
operation_id: null
path: /apps/status
method: GET
summary: 특정 애플리케이션의 현재 상태를 조회한다
capability: 단일 애플리케이션 상태 조회 (Running/Stopped/Error 등)
usable_in:
- query
operation_kind: read
when_to_use:
- 하나의 특정 애플리케이션이 지금 돌아가고 있는지 확인할 때
- '앱 상태, 살아있어?, running이야?, 헬스체크 등의 표현이 쓰일 때'
when_not_to_use:
- 여러 애플리케이션을 한 번에 보려면 application.get_apps를 사용
- 로그가 필요하면 application.get_apps_logs를 사용
- 자원 사용량/사양이 필요하면 application.get_apps_details를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers: []
required_inputs:
  headers: []
  path: []
  query:
  - name: project_id
    required: true
    type: string
  - name: app_name
    required: true
    type: string
  body: null
preconditions:
- 어느 프로젝트의 어떤 애플리케이션인지 특정이 필요합니다.
missing_info_questions:
- 어느 프로젝트의 앱인가요?
- 어느 애플리케이션(이름)의 상태를 조회할까요?
response_interpretation: 애플리케이션의 상태 값을 사용자 친화적으로 설명합니다.
plan_template: []
examples:
- "bang 프로젝트 api 앱 상태 확인"
- "test 프로젝트 webapp 살아있어?"
- "myproject worker 앱 running 이야?"
