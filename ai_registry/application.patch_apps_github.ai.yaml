id: application.patch_apps_github
source_file: apis/application.yaml
operation_id: null
path: /apps/github
method: PATCH
summary: 애플리케이션의 GitHub 저장소 정보를 연결하거나 변경한다
capability: 애플리케이션 GitHub 연동 정보 설정 (owner/repository/branch)
usable_in:
- command
operation_kind: write
when_to_use:
- 애플리케이션의 소스 저장소(GitHub)를 변경하거나 새로 연결할 때
- '깃허브 연결, 레포 바꿔, 브랜치 변경, 소스 연결 등의 표현이 쓰일 때'
when_not_to_use:
- 자원(CPU/메모리/디스크) 변경은 application.patch_apps_resources를 사용
- 새 앱을 만드는 경우에는 application.create_apps를 사용
- GitHub 정보를 조회만 하려면 application.get_apps_details를 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 다음 배포부터 지정한 저장소/브랜치에서 빌드됨
required_headers: []
required_inputs:
  headers: []
  path: []
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/UpdateGithubInfoRequestDto'
    type: object
    required_fields:
    - appDeploymentId
    - owner
    - repository
important_inputs:
  path: []
  query: []
  body:
  - project_id
  - appDeploymentId
  - owner
  - repository
  - branch
preconditions:
- 대상 애플리케이션과 연결할 GitHub owner/repository 정보가 필요합니다.
missing_info_questions:
- 어느 프로젝트의 앱인가요?
- 어느 애플리케이션의 GitHub 정보를 변경할까요?
- GitHub owner(조직/사용자명)는 무엇인가요?
- repository 이름은 무엇인가요?
- 어떤 브랜치를 사용할까요? (생략하면 기본 브랜치)
response_interpretation: 연결된 owner/repository/branch를 사용자에게 명확히 보여줍니다.
plan_template:
- 대상 애플리케이션과 새 GitHub 정보를 확인합니다.
- 다음 배포부터 적용된다는 점을 설명하고 사용자 승인을 받습니다.
- 변경 결과를 요약합니다.
examples:
- "bang 프로젝트 api 앱을 myorg/myrepo에 연결해줘"
- "test 프로젝트 webapp 브랜치 main으로 바꿔"
- "myproject worker 깃허브 레포 변경"
