id: project.list_projects
source_file: apis/project.yaml
operation_id: list_projects_endpoint_projects_get
path: /projects
method: GET
summary: 사용자가 접근 가능한 프로젝트 목록을 조회한다
capability: 내 프로젝트 목록 조회 (이름, ID, 역할, 상태)
usable_in:
- query
operation_kind: read
when_to_use:
- 사용자가 자신의 프로젝트 목록을 보고 싶을 때
- '프로젝트 목록, 내 프로젝트, 프로젝트 뭐 있어, 프로젝트 보여줘 등의 표현이 쓰일 때'
- 특정 프로젝트 이름을 확인하기 전에 전체 목록이 필요할 때
when_not_to_use:
- 특정 프로젝트의 상세 정보가 필요하면 project.get을 사용
- 프로젝트의 멤버 목록이 필요하면 project.list_members를 사용
- 애플리케이션(앱) 목록이 필요하면 application.get_apps를 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path: []
  query: []
  body: null
preconditions:
- 별도의 입력값이 필요하지 않습니다. 현재 로그인 사용자의 프로젝트 목록이 반환됩니다.
missing_info_questions: []
response_interpretation: 각 프로젝트의 이름, 역할(OWNER/MEMBER), 상태를 한 줄씩 정리하여 사용자에게 보여줍니다.
plan_template: []
examples:
- "프로젝트 목록 보여줘"
- "내 프로젝트 뭐 있어?"
- "프로젝트 조회"
- "project list"
