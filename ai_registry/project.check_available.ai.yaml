id: project.check_available
source_file: apis/project.yaml
operation_id: check_project_available_endpoint_projects_available_get
path: /projects/available
method: GET
summary: 현재 사용자가 특정 프로젝트에 접근 가능한지 확인한다
capability: 프로젝트 접근 가능 여부 확인
usable_in:
- query
operation_kind: read
when_to_use:
- 사용자가 특정 프로젝트에 접근할 수 있는지 묻는 경우
- '접근 가능해?, 사용 가능한지, 볼 수 있어? 등의 표현이 쓰일 때'
when_not_to_use:
- 소유자 여부만 확인하려면 project.check_owner를 사용
- 프로젝트의 상세 정보가 필요하면 project.get을 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path: []
  query:
  - name: project_id
    required: true
    type: integer
    description: 확인할 프로젝트 ID
  body: null
preconditions:
- 확인할 프로젝트의 이름 또는 ID가 필요합니다.
missing_info_questions:
- 어떤 프로젝트의 접근 가능 여부를 확인할까요?
response_interpretation: status true/false를 한국어 문장으로 풀어 설명합니다.
plan_template: []
examples:
- "bang 프로젝트 접근할 수 있어?"
- "test 프로젝트 사용 가능한지 확인해줘"
