id: application.get_apps_details
source_file: apis/application.yaml
operation_id: null
path: /apps/details
method: GET
summary: 특정 애플리케이션의 상세 정보(자원/설정/GitHub 연동 등)를 조회한다
capability: 애플리케이션 상세 정보 조회 (CPU/메모리/디스크, GitHub 정보, 배포 설정)
usable_in:
- query
operation_kind: read
when_to_use:
- 애플리케이션의 스펙, 자원 할당, 연결된 GitHub 저장소 등 세부 정보가 필요할 때
- '앱 세부 정보, 설정 보여줘, CPU 얼마 줬어?, 어느 레포 연결됐어? 등의 표현이 쓰일 때'
when_not_to_use:
- 단순 상태(running 여부)만 보려면 application.get_apps_status를 사용
- 로그는 application.get_apps_logs를 사용
- 프로젝트 단위 자원 한도는 project.get_resource_limit을 사용
requires_confirmation: false
risk_level: low
side_effects: []
required_headers: []
required_inputs:
  headers: []
  path: []
  query:
  - name: project_id
    required: true
    type: string
  - name: app_name
    required: true
    type: string
  body: null
preconditions:
- 어느 프로젝트의 어떤 애플리케이션인지 특정이 필요합니다.
missing_info_questions:
- 어느 프로젝트의 앱인가요?
- 어느 애플리케이션의 세부 정보를 조회할까요?
response_interpretation: 자원 할당(CPU/메모리/디스크), GitHub 저장소, 브랜치 등 주요 항목을 요약해서 보여줍니다.
plan_template: []
examples:
- "bang 프로젝트 api 앱 세부정보"
- "test 프로젝트 webapp 설정 보여줘"
- "myproject worker 어느 레포 연결돼 있어?"
