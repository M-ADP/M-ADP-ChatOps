id: application.create_apps
source_file: apis/application.yaml
operation_id: null
path: /apps
method: POST
summary: 프로젝트 내에 새 애플리케이션을 생성(배포)한다
capability: 애플리케이션 생성 (이름, CPU/메모리/디스크 지정)
usable_in:
- command
operation_kind: write
when_to_use:
- 프로젝트 안에 새 앱을 배포하거나 만들 때
- '앱 만들어줘, 애플리케이션 생성, 배포해줘, 새 앱 올려줘 등의 표현이 쓰일 때'
when_not_to_use:
- 새 프로젝트를 만드는 경우에는 project.create를 사용 (애플리케이션이 아닌 프로젝트 단위)
- 기존 앱의 자원을 바꾸는 경우에는 application.patch_apps_resources를 사용
- GitHub 연동만 업데이트하려면 application.patch_apps_github을 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 새 애플리케이션이 생성되고 프로젝트 자원에서 지정한 양만큼 할당됨
required_headers: []
required_inputs:
  headers: []
  path: []
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/CreateAppDeploymentRequestDto'
    type: object
    required_fields:
    - name
    - cpu
    - memory
    - disk
    - project_id
important_inputs:
  path: []
  query: []
  body:
  - project_id
  - name
  - cpu
  - memory
  - disk
preconditions:
- 대상 프로젝트와 새 애플리케이션 이름, 자원 사양이 모두 필요합니다.
- 프로젝트에 남은 자원 한도가 충분해야 합니다.
missing_info_questions:
- 어느 프로젝트에 앱을 만들까요?
- 새 애플리케이션 이름은 무엇으로 할까요?
- CPU는 얼마나 할당할까요?
- 메모리는 얼마나 할당할까요?
- 디스크는 얼마나 할당할까요?
response_interpretation: 생성된 애플리케이션 이름, 할당된 자원(CPU/메모리/디스크)을 요약해 보여줍니다.
plan_template:
- 대상 프로젝트와 앱 이름, 자원 사양을 확인합니다.
- 프로젝트 자원 한도 대비 여유가 있는지 확인하고 사용자에게 설명한 뒤 승인을 받습니다.
- 생성 결과를 요약합니다.
examples:
- "bang 프로젝트에 api 앱 CPU 2, 메모리 4GB, 디스크 10GB로 만들어줘"
- "test 프로젝트에 webapp 생성해줘"
- "myproject에 worker 애플리케이션 배포"
