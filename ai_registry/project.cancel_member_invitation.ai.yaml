id: project.cancel_member_invitation
source_file: apis/project.yaml
operation_id: cancel_project_member_invitation_endpoint_projects__project_id__member_invitations__invitation_id__delete
path: /projects/{project_id}/member-invitations/{invitation_id}
method: DELETE
summary: 발송된 멤버 초대를 취소한다
capability: 프로젝트 멤버 초대 취소 (수락 전 초대 철회)
usable_in:
- command
operation_kind: delete
when_to_use:
- 이미 발송한 초대를 취소하거나 철회할 때
- '초대 취소, 초대 철회, 초대 삭제 등의 표현이 쓰일 때'
when_not_to_use:
- 합류한 멤버를 제거하려면 project.remove_member를 사용
- 초대 목록 확인은 project.list_member_invitations를 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 해당 초대 링크가 무효화되어 대상 사용자가 수락 불가
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  - name: invitation_id
    required: true
    type: integer
  query: []
  body: null
preconditions:
- 대상 프로젝트와 취소할 초대 ID가 필요합니다.
missing_info_questions:
- 어느 프로젝트의 초대를 취소할까요?
- 어떤 초대를 취소할까요? (대상 사용자 닉네임 또는 초대 ID)
response_interpretation: 초대가 취소됐음을 확인하고, 대상 사용자가 더 이상 수락할 수 없음을 안내합니다.
plan_template:
- 취소할 초대를 확인합니다.
- 초대 취소 전 사용자에게 영향을 설명하고 승인을 받습니다.
- 취소 결과를 요약합니다.
examples:
- "myapp 프로젝트에서 jaemin 초대 취소해줘"
- "bang 프로젝트 초대 철회해줘"
