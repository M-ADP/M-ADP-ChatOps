id: project.update_resource
source_file: apis/project.yaml
operation_id: update_project_resource_endpoint_projects__project_id__resource_patch
path: /projects/{project_id}/resource
method: PATCH
summary: 프로젝트의 자원 한도(CPU/메모리/디스크)를 변경한다
capability: 프로젝트 자원 한도 수정 (max_cpu, max_memory, max_disk 변경)
usable_in:
- command
operation_kind: write
when_to_use:
- 프로젝트의 CPU/메모리/디스크 쿼터를 늘리거나 줄일 때
- "리소스 늘려줘", "CPU 4로 바꿔줘", "자원 한도 변경", "쿼터 조정" 등의 표현이 쓰일 때
when_not_to_use:
- 프로젝트 이름만 바꿀 때는 project.update_name을 사용
- 자원 한도를 조회만 할 때는 project.get_resource_limit을 사용
- 애플리케이션 자원 변경은 application.patch_apps_resources를 사용
requires_confirmation: true
risk_level: medium
side_effects:
- 프로젝트의 자원 한도가 변경됨 (기존 애플리케이션 배포에 영향 가능)
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  query: []
  body:
    required: true
    content_type: application/json
    schema_ref: '#/components/schemas/ProjectResourceUpdate'
    type: object
important_inputs:
  path: []
  query: []
  body:
  - max_cpu
  - max_memory
  - max_disk
preconditions:
- 대상 프로젝트와 새 자원 값(CPU/메모리/디스크 중 변경할 것) 확인이 필요합니다.
missing_info_questions:
- 어느 프로젝트의 자원 한도를 변경할까요?
- 새로운 CPU 한도는 얼마로 할까요? (생략하면 유지)
- 새로운 메모리 한도는 얼마로 할까요? (생략하면 유지)
- 새로운 디스크 한도는 얼마로 할까요? (생략하면 유지)
response_interpretation: 변경 전/후 max_cpu, max_memory, max_disk 값을 비교해서 요약합니다.
plan_template:
- 변경할 프로젝트와 새 자원 값을 확인합니다.
- 변경 전 사용자에게 영향을 설명하고 승인을 받습니다.
- 변경 후 결과를 요약합니다.
examples:
- "bang 프로젝트 CPU를 4로 바꿔줘"
- "test 프로젝트 메모리 8GB로 늘려줘"
- "myproject 자원 한도 조정: CPU 2, 메모리 4GB, 디스크 20GB"
