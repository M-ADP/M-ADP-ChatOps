id: project.remove_member
source_file: apis/project.yaml
operation_id: remove_project_member_endpoint_projects__project_id__members__target_user_id__delete
path: /projects/{project_id}/members/{target_user_id}
method: DELETE
summary: 프로젝트에서 멤버를 제거한다
capability: 프로젝트 멤버 제거 (특정 사용자의 참여 해제)
usable_in:
- command
operation_kind: delete
when_to_use:
- 프로젝트에서 특정 멤버를 빼야 할 때
- '멤버 삭제, 내보내줘, 제외해줘, 빼줘 등의 표현이 쓰일 때'
when_not_to_use:
- 멤버를 추가하려면 project.add_member를 사용
- 프로젝트 자체를 지우려면 project.delete를 사용
- 소유권 이전은 project.transfer_ownership을 사용
requires_confirmation: true
risk_level: high
side_effects:
- 대상 사용자가 더 이상 해당 프로젝트에 접근할 수 없게 됨
required_headers:
- X-User-Id
- X-User-Role
required_inputs:
  headers:
  - name: X-User-Id
    required: true
    type: string
    description: 사용자 식별자
  - name: X-User-Role
    required: true
    type: string
    description: 사용자 역할
  path:
  - name: project_id
    required: true
    type: integer
  - name: target_user_id
    required: true
    type: integer
  query: []
  body: null
preconditions:
- 대상 프로젝트와 제거할 멤버의 사용자 식별자가 필요합니다.
missing_info_questions:
- 어느 프로젝트에서 멤버를 제거할까요?
- 제거할 사용자는 누구인가요? (사용자 ID 또는 사용자명)
response_interpretation: 제거된 멤버의 사용자명과 프로젝트를 요약합니다.
plan_template:
- 대상 프로젝트와 제거 대상 사용자를 확인합니다.
- 제거 전 사용자에게 영향을 설명하고 승인을 받습니다.
- 제거 결과를 요약합니다.
examples:
- "bang 프로젝트에서 jaemin 빼줘"
- "test 프로젝트 멤버 홍길동 삭제"
- "myproject에서 user123 제외해줘"
